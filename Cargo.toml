[workspace]
resolver = "2"
members = ["crates/jsrt", "crates/jsrt-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
deno_core = "=0.413.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "charset"] }
tempfile = "3"
deno_error = "0.7"
libc = "0.2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
