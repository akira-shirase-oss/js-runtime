[workspace]
resolver = "2"
members = ["crates/jsrt", "crates/jsrt-host", "crates/jsrt-load"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Not published: the crates are built from this repository only.
publish = false

[workspace.dependencies]
deno_core = "=0.413.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "charset"] }
tempfile = "3"
deno_error = "0.7"
libc = "0.2"

[workspace.lints.rust]
# Unsafe lives only in the supervisor's libc calls (crates/jsrt); the host
# and the load driver forbid it in their own crate roots.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Every unsafe block says why it is sound.
undocumented_unsafe_blocks = "deny"
