name: ci

on:
  push:
  pull_request:
  schedule:
    # Daily: new advisories appear without any code change.
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Third-party actions are pinned to full commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-deny (pinned release, checksum verified)
        run: |
          scripts/install-cargo-deny.sh "$RUNNER_TEMP/cargo-deny"
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"
      - name: Gate (toolchain, fmt, clippy, tests, cargo-deny)
        run: scripts/check.sh
