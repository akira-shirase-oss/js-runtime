# cargo-deny configuration. `scripts/check.sh` (and so CI) runs the full
# `cargo deny --locked check`: advisories, licences, bans and sources all
# gate the build.

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is unmaintained (archived), not reported vulnerable. It reaches jsrt only through v8 150.4.0 via the pinned deno_core =0.413.0, and no maintained replacement exists upstream. Re-check on the next deno_core upgrade." },
]

[licenses]
# Permissive licences, plus two that the pinned engine stack needs:
# - MPL-2.0 (file-level copyleft): cooked-waker, through deno_core. Using
#   it unmodified as a dependency asks nothing of this repository.
# - CDLA-Permissive-2.0: the Mozilla root certificates in webpki-roots,
#   which rt.fetch's TLS verification uses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path; they are not published.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "rt.fetch uses rustls: one TLS stack to patch" },
    { crate = "openssl-sys", reason = "rt.fetch uses rustls: one TLS stack to patch" },
    { crate = "native-tls", reason = "rt.fetch uses rustls: one TLS stack to patch" },
    { crate = "async-std", reason = "one async runtime: tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
